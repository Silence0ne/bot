[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
recursive_version_locations = true
timezone = UTC

# Filled dynamically by alembic/env.py
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = default

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = default

[formatter_default]
format = %(levelname)-5.5s [%(name)s] %(message)s
